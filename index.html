<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>llamaland</title>
<!-- ?v=…: change it (to the date) whenever style.css or main.js changes, so browsers fetch the new files -->
<link rel="stylesheet" href="style.css?v=2026-10-10c" />
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  } }
</script>
</head>
<body>
<div id="herd-bubble"></div>
<div id="hold-tip"><span></span><div class="bar"><i></i></div></div>
<div id="poke-tip">poke me ♪</div>
<div id="rain-tint"></div>
<div id="flash"></div>
<div id="intro"><div class="card"></div><button id="play" aria-label="Play, with sound">
  <svg viewBox="0 0 7 13" shape-rendering="crispEdges" fill="currentColor"><rect x="0" y="0" width="1" height="13"/><rect x="1" y="1" width="1" height="11"/><rect x="2" y="2" width="1" height="9"/><rect x="3" y="3" width="1" height="7"/><rect x="4" y="4" width="1" height="5"/><rect x="5" y="5" width="1" height="3"/><rect x="6" y="6" width="1" height="1"/></svg><span>Play</span>
</button></div>
<div id="hint">move your cursor</div>
<button id="panel-toggle">controls</button>
<div id="panel">
  <div class="head"><h4>View</h4><button class="close" aria-label="Close">×</button></div>
  <div class="row"><label for="zoom">Zoom</label><input id="zoom" type="range" min="0.25" max="2" step="0.01"></div>
  <div class="row"><label for="orbit">Orbit</label><input id="orbit" type="range" min="-180" max="180" step="1"></div>
  <div class="row"><label for="tilt">Tilt</label><input id="tilt" type="range" min="12" max="85" step="1"></div>
  <div class="row"><label for="bg">Ground</label><input id="bg" type="color" value="#ffffff"></div>
  <div class="row" id="sound-row"><label for="sound">Sound</label><input id="sound" type="checkbox" checked>
    <select id="tune" aria-label="Tune"></select></div>
  <div class="row" id="music-row"><label for="music">Music</label><input id="music" type="checkbox" checked></div>
  <div class="row" id="rain-row"><label for="rain">Rain</label><input id="rain" type="checkbox" checked></div>
  <div class="row" id="blight-row"><label for="blight">Blight</label><input id="blight" type="checkbox" checked><span id="blight-pct"></span></div>
  <h4>Llamas</h4>
  <div id="llama-list"></div>
  <div class="buttons"><button id="add-llama">+ add</button><button id="remove-llama">− remove</button></div>
</div>
<script type="module" src="main.js?v=2026-10-10c"></script>
</body>
</html>
