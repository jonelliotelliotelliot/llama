<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Llama Playground</title>
<link rel="stylesheet" href="style.css" />
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="label">llama playground</div>
<div id="herd-bubble"></div>
<div id="hold-tip"><span></span><div class="bar"><i></i></div></div>
<div id="poke-tip">poke me ♪</div>
<div id="hint">move your cursor</div>
<button id="panel-toggle">controls</button>
<div id="panel">
  <div class="head"><h4>View</h4><button class="close" aria-label="Close">×</button></div>
  <div class="row"><label for="zoom">Zoom</label><input id="zoom" type="range" min="0.25" max="2" step="0.01"></div>
  <div class="row"><label for="orbit">Orbit</label><input id="orbit" type="range" min="-180" max="180" step="1"></div>
  <div class="row"><label for="tilt">Tilt</label><input id="tilt" type="range" min="12" max="85" step="1"></div>
  <div class="row"><label for="bg">Ground</label><input id="bg" type="color" value="#ffffff"></div>
  <div class="row" id="sound-row"><label for="sound">Sound</label><input id="sound" type="checkbox" checked>
    <select id="tune" aria-label="Tune"></select></div>
  <div class="row" id="music-row"><label for="music">Music</label><input id="music" type="checkbox" checked></div>
  <h4>Llamas</h4>
  <div id="llama-list"></div>
  <div class="buttons"><button id="add-llama">+ add</button><button id="remove-llama">− remove</button></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
